name: Sugerir uma melhoria
description: Proponha uma mudança de produto ou experiência.
title: "[Melhoria]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qual necessidade do usuário esta proposta atende?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como a experiência deveria funcionar?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Impacto em privacidade e segurança
      description: A mudança coleta, compartilha ou deriva novos dados?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
